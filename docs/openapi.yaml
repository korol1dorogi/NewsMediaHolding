          $ref: "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkSubmissionInput"
            example:
              expected_version: 9
              text: Подготовлен демонстрационный пакет документов.
  /api/cases/{id}/work/accept:
    post:
      operationId: acceptWork
      tags:
        - work
      summary: Принять результат работы
      description: >-
        Только владелец в work_submitted; сервер принимает конкретную версию, выполняет release demo hold.
        Автоприёмка через3дня —внутреннее событие, не клиентский флаг.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
        - name: X-CSRFToken
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            example: demo-csrf-token
          description: Значение cookie csrftoken текущей сессии (K2). Не секретный пример.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
              example:
                id: 00000000-0000-4000-8000-000000000001
                state: completed
                path: specialist
                ai_state: idle
                version: 11
                created_at: "2026-11-15T10:00:00Z"
                updated_at: "2026-11-15T10:00:00Z"
                available_actions:
                  - close_case
                card_confirmed_at: "2026-11-15T09:00:00Z"
                pool: null
                work:
                  version: 1
                  text: Подготовлен демонстрационный пакет документов.
                  submitted_at: "2026-11-15T10:00:00Z"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptWorkInput"
            example:
              expected_version: 10
              work_version: 1
  /api/cases/{id}/close:
    post:
      operationId: closeCase
      tags:
        - cases
      summary: Закрыть своё обращение
      description: >-
        Существующий переход активное →closed. Нельзя обходить незавершённый hold; его завершение/возврат и
        спорные случаи требуют согласованной политики (вопрос K1 в assumptions), пока такое действие не
        предлагается в available_actions.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
        - name: X-CSRFToken
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            example: demo-csrf-token
          description: Значение cookie csrftoken текущей сессии (K2). Не секретный пример.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
              example:
                id: 00000000-0000-4000-8000-000000000001
                state: closed
                path: self_guided
                ai_state: idle
                version: 12
                created_at: "2026-11-15T10:00:00Z"
                updated_at: "2026-11-15T10:00:00Z"
                available_actions: []
                card_confirmed_at: "2026-11-15T09:00:00Z"
                pool: null
                work: null
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseCaseInput"
            example:
              expected_version: 11
              reason: Пользователь завершил обращение.
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sessionid
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Readiness:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          required:
            - database
            - redis
          properties:
            database:
              type: boolean
            redis:
              type: boolean
    CaseState:
      type: string
      enum:
        - draft
        - clarifying
        - card_ready
        - card_confirmed
        - self_guided
        - claim_draft
        - in_pool
        - closed
        - claim_in_review
        - claim_approved
        - claim_edited
        - awaiting_response
        - resolved
        - no_response
        - has_offers
        - no_offers
        - offer_accepted
        - in_progress
        - work_submitted
        - completed
        - disputed
      example: draft
    AiState:
      type: string
      enum:
        - idle
        - thinking
        - failed
      example: idle
    CasePath:
      type: string
      enum:
        - self_guided
        - claim
        - specialist
      example: self_guided
    FactStatus:
      type: string
      enum:
        - found
        - not_found
        - user_edited
      example: found
    MoneyKopecks:
      type: integer
      minimum: 0
      example: 6800000
      description: Целое число копеек RUB, без float. Лимиты и цены проверяет сервер.
    Action:
      type: string
      enum:
        - send_message
        - upload_document
        - confirm_card
        - choose_path
        - create_claim
        - confirm_personal_data
        - submit_claim
        - accept_edits
        - reject_edits
        - mark_sent
        - record_outcome
        - publish_pool
        - accept_offer
        - take_claim
        - approve_claim
        - edit_claim
        - start_work
        - submit_work
        - accept_work
        - close_case
      example: send_message
    Version:
      type: integer
      minimum: 1
      example: 1
    ConsentInput:
      type: object
      additionalProperties: false
      required:
        - accepted
        - text_version
      properties:
        accepted:
          type: boolean
          const: true
          example: true
        text_version:
          type: string
          minLength: 1
          example: demo-v1
    VersionInput:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        expected_version:
          $ref: "#/components/schemas/Version"
          description: Ожидаемая Case.version, не номер ClaimVersion и не версия назначения.
    ConsentVersionInput:
      type: object
      additionalProperties: false
      required:
        - expected_version
        - consent
      properties:
        expected_version:
          $ref: "#/components/schemas/Version"
          description: Ожидаемая Case.version, не номер ClaimVersion и не версия назначения.
        consent:
          $ref: "#/components/schemas/ConsentInput"
    ErrorDetails:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
      example:
        fields:
          - payment_date
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          minLength: 1
          example: invalid_transition
        message:
          type: string
          minLength: 1
          example: Действие недоступно в текущем состоянии
        details:
          $ref: "#/components/schemas/ErrorDetails"
    CaseSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - path
        - ai_state
        - version
        - created_at
        - updated_at
        - available_actions
      properties:
        id:
          type: string
          minLength: 1
          example: 00000000-0000-4000-8000-000000000001
          format: uuid
        state:
          $ref: "#/components/schemas/CaseState"
        path:
          anyOf:
            - $ref: "#/components/schemas/CasePath"
            - type: "null"
        ai_state:
          $ref: "#/components/schemas/AiState"
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          minLength: 1
          example: "2026-11-15T10:00:00Z"
          format: date-time
        updated_at:
          type: string
          minLength: 1
          example: "2026-11-15T10:00:00Z"
          format: date-time
        available_actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
      example:
        id: 00000000-0000-4000-8000-000000000001
        state: card_ready
        path: null
        ai_state: idle
        version: 2
        created_at: "2026-11-15T10:00:00Z"
        updated_at: "2026-11-15T10:00:00Z"
        available_actions:
          - confirm_card
          - close_case
    CaseDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - path
        - ai_state
        - version
        - created_at
        - updated_at
        - available_actions
        - card_confirmed_at
        - pool
        - work
      properties:
        id:
          type: string
          minLength: 1
          example: 00000000-0000-4000-8000-000000000001
          format: uuid
        state:
          $ref: "#/components/schemas/CaseState"
        path:
          anyOf:
            - $ref: "#/components/schemas/CasePath"
            - type: "null"
        ai_state:
          $ref: "#/components/schemas/AiState"
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          minLength: 1
          example: "2026-11-15T10:00:00Z"
          format: date-time
        updated_at:
          type: string
          minLength: 1
          example: "2026-11-15T10:00:00Z"
          format: date-time
        available_actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        card_confirmed_at:
          anyOf:
            - type: string
              minLength: 1
              example: "2026-11-15T10:00:00Z"
              format: date-time
            - type: "null"
        pool:
          anyOf:
            - $ref: "#/components/schemas/OwnerPoolStatus"
            - type: "null"
        work:
          anyOf:
            - $ref: "#/components/schemas/WorkResult"
            - type: "null"
      example:
        id: 00000000-0000-4000-8000-000000000001
        state: work_submitted
        path: specialist
        ai_state: idle
        version: 10
        created_at: "2026-11-15T10:00:00Z"
        updated_at: "2026-11-15T10:00:00Z"
        available_actions:
          - accept_work
        card_confirmed_at: "2026-11-15T09:00:00Z"
        pool: null
        work:
          version: 1
          text: Подготовлен демонстрационный пакет документов.
          submitted_at: "2026-11-15T10:00:00Z"
    CreateCaseInput:
      type: object
      additionalProperties: false
      required:
        - message
        - consent
      properties:
        message:
          type: string
          minLength: 1
          example: Оплатила вымышленный курс, хочу вернуть деньги.
        consent:
          $ref: "#/components/schemas/ConsentInput"
    Message:
      type: object
      additionalProperties: false
      required:
        - id
        - author
        - text
        - created_at
      properties:
        id:
          type: string
          minLength: 1
          example: 00000000-0000-4000-8000-000000000002
          format: uuid
        author:
          type: string
          enum:
            - user
            - ai
          example: user
        text:
          type: string
          minLength: 1
          example: Уточните дату оплаты вымышленного курса.
        created_at:
          type: string
          minLength: 1
          example: "2026-11-15T10:00:00Z"
          format: date-time
      example:
        id: 00000000-0000-4000-8000-000000000002
        author: user
        text: Оплатила вымышленный курс 1 октября. Учебный проект Демо. Стоимость 68000 рублей.
        created_at: "2026-11-15T10:00:00Z"
    MessageInput:
      type: object
      additionalProperties: false
      required:
        - text
        - expected_version
      properties:
        text:
          type: string
          minLength: 1
          example: Оплатила вымышленный курс 1 октября.
        expected_version:
          $ref: "#/components/schemas/Version"
          description: Ожидаемая Case.version, не номер ClaimVersion и не версия назначения.
      example:
        text: Оплатила вымышленный курс 1 октября. Учебный проект Демо. Стоимость 68000 рублей.
        expected_version: 1
    MessageAccepted:
      type: object
      additionalProperties: false
      required:
        - message
        - case
      properties:
        message:
          $ref: "#/components/schemas/Message"
        case:
          $ref: "#/components/schemas/CaseSummary"
    DocumentMetadata:
      type: object
      additionalProperties: false
      required:
        - id
        - filename
        - content_type
        - size_bytes
        - created_at
      properties:
        id:
          type: string
          minLength: 1
          example: 00000000-0000-4000-8000-000000000003
          format: uuid
        filename:
          type: string
          minLength: 1
          example: demo-receipt.txt
        content_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - text/plain
          example: image/jpeg
        size_bytes:
          type: integer
          minimum: 1
          example: 128
        created_at:
          type: string
          minLength: 1
          example: "2026-11-15T10:00:00Z"
          format: date-time
      example:
        id: 00000000-0000-4000-8000-000000000003
        filename: demo-receipt.txt
        content_type: text/plain
        size_bytes: 128
        created_at: "2026-11-15T10:00:00Z"
    FactSource:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - source_version
      properties:
        kind:
          type: string
          enum:
            - message
            - document
          example: message
        id:
          type: string
          minLength: 1
          example: 00000000-0000-4000-8000-000000000002
          format: uuid
        source_version:
          $ref: "#/components/schemas/Version"
    Fact:
      type: object
      additionalProperties: false
      required:
        - key
        - value
        - status
        - source
        - source_quote
        - required
      properties:
        key:
          type: string
          minLength: 1
          example: company_name
        value:
          anyOf:
            - type: string
              minLength: 1
              example: Учебный проект Демо
            - type: "null"
        status:
          $ref: "#/components/schemas/FactStatus"
        source:
          anyOf:
            - $ref: "#/components/schemas/FactSource"
            - type: "null"
        source_quote:
          anyOf:
            - type: string
              minLength: 1
              example: Учебный проект Демо
            - type: "null"
        required:
          type: boolean
          example: true
      allOf:
        - if:
            properties:
              status:
                const: found
          then:
            properties:
              value:
                type: string
                minLength: 1
                example: Синтетический пример
              source:
                $ref: "#/components/schemas/FactSource"
              source_quote:
                type: string
                minLength: 1
                example: Синтетический пример
        - if:
            properties:
              status:
                const: not_found
          then:
            properties:
              value:
                type: "null"
              source:
                type: "null"
              source_quote:
                type: "null"
        - if:
            properties:
              status:
                const: user_edited
          then:
            properties:
              value:
                type: string
                minLength: 1
                example: Синтетический пример
      description: >-
        found: непустое значение, источник и дословная цитата обязательны. not_found: value/source/quote=null.
        user_edited: непустое значение, источник может отсутствовать; редактирует владелец.
    Card:
      type: object
      additionalProperties: false
      required:
        - version
        - confirmed_at
        - facts
        - missing_required_fields
      properties:
        version:
          $ref: "#/components/schemas/Version"
        confirmed_at:
          anyOf:
            - type: string
              minLength: 1
              example: "2026-11-15T10:00:00Z"
              format: date-time
            - type: "null"
        facts:
          type: array
          items:
            $ref: "#/components/schemas/Fact"
        missing_required_fields:
          type: array
          items:
            type: string
            minLength: 1
            example: payment_date
      example:
        version: 1
        confirmed_at: null
        facts:
          - key: company_name
            value: Учебный проект Демо
            status: found
            source:
              kind: message
              id: 00000000-0000-4000-8000-000000000002
              source_version: 1
            source_quote: Учебный проект Демо
            required: true
          - key: payment_date
            value: null
            status: not_found
            source: null
            source_quote: null
            required: true
        missing_required_fields:
          - payment_date
    EditFactInput:
      type: object
      additionalProperties: false
      required:
        - value
        - expected_version
      properties:
        value:
          type: string
          minLength: 1
          example: Учебный проект Демо
        expected_version:
          $ref: "#/components/schemas/Version"
          description: Ожидаемая Case.version, не номер ClaimVersion и не версия назначения.
    CompanyStatus:
      type: string
      enum:
        - active
        - liquidating
        - bankrupt
        - unavailable
      example: active
    CompanyCheck:
      type: object
      additionalProperties: false
      required:
        - status
        - name
        - inn
        - registered_on
        - source
        - checked_at
        - is_demo
      properties:
        status:
          $ref: "#/components/schemas/CompanyStatus"
        name:
          anyOf:
            - type: string
              minLength: 1
              example: Учебный проект Демо
            - type: "null"
        inn:
          anyOf:
            - type: string
              minLength: 1
              example: "0000000000"
              pattern: ^(?:[0-9]{10}|[0-9]{12})$
            - type: "null"
        registered_on:
          anyOf:
            - type: string
              minLength: 1
              example: "2026-11-15"
              format: date
            - type: "null"
        source:
          type: string
          minLength: 1
          example: demo-fixture
        checked_at:
          type: string
          minLength: 1
          example: "2026-11-15T10:00:00Z"
          format: date-time
        is_demo:
          type: boolean
          example: true
    PathOption:
      type: object
      additionalProperties: false
      required:
        - path
        - title
        - available
        - reason
        - estimated_days
        - price_kopecks
      properties:
        path:
          $ref: "#/components/schemas/CasePath"
        title:
          type: string
          minLength: 1
          example: Реши сам
        available:
          type: boolean
          example: true
        reason:
          anyOf:
            - type: string
              minLength: 1
              example: Компания недоступна для проверки
            - type: "null"
        estimated_days:
          type: integer
          minimum: 0
          example: 1
        price_kopecks:
          anyOf:
            - $ref: "#/components/schemas/MoneyKopecks"
            - type: "null"
    PathInput:
      type: object
      additionalProperties: false
      required:
        - path
        - expected_version
      properties:
        path:
          $ref: "#/components/schemas/CasePath"
        expected_version:
          $ref: "#/components/schemas/Version"
          description: Ожидаемая Case.version, не номер ClaimVersion и не версия назначения.
    LegalNorm:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - url
        - verified_by_lawyer
      properties:
        id:
          type: string
          minLength: 1
          example: demo-rule-1
        title:
          type: string
          minLength: 1
          example: Демонстрационное правило
        url:
          type: string
          minLength: 1
          example: https://example.invalid/demo-rule
          format: uri
        verified_by_lawyer:
          type: boolean
          example: false
    PlanStep:
      type: object
      additionalProperties: false
      required:
        - order
        - text
        - due_on
        - documents
        - destination
        - norms
      properties:
        order:
          type: integer
          minimum: 1
          example: 1
        text:
          type: string
          minLength: 1
          example: Сохраните подтверждение оплаты.
        due_on:
          anyOf:
            - type: string
              minLength: 1
              example: "2026-11-15"
              format: date
            - type: "null"
        documents:
          type: array
          items:
            type: string
            minLength: 1
            example: Чек
        destination:
          type: string
          minLength: 1
          example: Демонстрационная компания
        norms:
          type: array
          items:
            $ref: "#/components/schemas/LegalNorm"
    SelfGuidedPlan:
      type: object
      additionalProperties: false
      required:
        - version
        - steps
        - disclaimer
      properties:
        version:
          $ref: "#/components/schemas/Version"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PlanStep"
        disclaimer:
          type: string
          minLength: 1
          example: Не является юридической консультацией. Демонстрационные нормы не проверены юристом.
    ClaimPersonalData:
      type: object
      additionalProperties: false
      required:
        - full_name
        - reply_address
        - contract_reference
      properties:
        full_name:
          type: string
          minLength: 1
          example: Демо Пользователь
        reply_address:
          type: string
          minLength: 1
          example: Вымышленный город, учебный адрес
        contract_reference:
          type: string
          minLength: 1
          example: DEMO-CONTRACT-1
      example:
        full_name: Демо Пользователь
        reply_address: Вымышленный город, учебный адрес
        contract_reference: DEMO-CONTRACT-1
    PersonalDataInput:
      type: object
      additionalProperties: false
      required:
        - expected_version
        - data
        - confirmed
      properties:
        expected_version:
          $ref: "#/components/schemas/Version"
          description: Ожидаемая Case.version, не номер ClaimVersion и не версия назначения.
        data:
          $ref: "#/components/schemas/ClaimPersonalData"
        confirmed:
          type: boolean
          const: true
          example: true
    ClaimVersion:
      type: object
      additionalProperties: false
      required:
        - version
        - author
        - text
        - comment
        - created_at
      properties:
        version:
          $ref: "#/components/schemas/Version"
        author:
          type: string
          enum:
            - ai
            - lawyer
          example: ai
        text:
          type: string
          minLength: 1
          example: Демонстрационная претензия по вымышленному курсу.
        comment:
          anyOf:
            - type: string
