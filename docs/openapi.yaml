openapi: 3.1.0
info:
  title: Сервис обращений API
  version: 1.0.0
  description: >-
    Контракт будущей реализации NMH, волны1–4. Системные endpoint уже существуют, продуктовые реализуют задачи
    B1–B10. Примеры синтетические, Prism не реализует авторизацию/переходы. Сессии+CSRF, один origin; поля
    владения/роли/оплаты/состояния задаёт сервер. /api/auth/* добавляет K2 в отдельной секции; K1 их не
    реализует. Демо-ИНН 0000000000 —только sentinel fixture, запрещён для внешнего реестра. Денежные суммы в
    копейках RUB.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Процесс жив
      tags:
        - system
      security: []
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
  /api/ready:
    get:
      operationId: getReady
      summary: Сервис готов принимать трафик
      tags:
        - system
      security: []
      responses:
        "200":
          description: База данных и Redis доступны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
                checks:
                  database: true
                  redis: true
        "503":
          description: Одна из зависимостей недоступна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: not_ready
                checks:
                  database: true
                  redis: false
  /api/cases:
    post:
      operationId: createCase
      tags:
        - cases
      summary: Создать обращение
      description: >-
        Создаёт обращение draft и первое сообщение с явным согласием. AI запускается асинхронно;
        ai_state=thinking. В mock ответ — пример, не доказательство работающего backend.
      parameters:
        - name: X-CSRFToken
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            example: demo-csrf-token
          description: Значение cookie csrftoken текущей сессии (K2). Не секретный пример.
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
              example:
                id: 00000000-0000-4000-8000-000000000001
                state: draft
                path: null
                ai_state: thinking
                version: 1
                created_at: "2026-11-15T10:00:00Z"
                updated_at: "2026-11-15T10:00:00Z"
                available_actions:
                  - close_case
                card_confirmed_at: null
                pool: null
                work: null
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseInput"
            example:
              message: Оплатила вымышленный курс, хочу вернуть деньги.
              consent:
                accepted: true
                text_version: demo-v1
    get:
      operationId: listCases
      tags:
        - cases
      summary: Свои обращения
      description: >-
        Контракт будущей реализации. Владелец/назначение и переход проверяются сервером; чужой объект — 404.
        Состояние, роль, оплата и владелец не принимаются из запроса.
      parameters: []
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cases"
              example:
                items:
                  - id: 00000000-0000-4000-8000-000000000001
                    state: card_ready
                    path: null
                    ai_state: idle
                    version: 2
                    created_at: "2026-11-15T10:00:00Z"
                    updated_at: "2026-11-15T10:00:00Z"
                    available_actions:
                      - confirm_card
                      - close_case
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /api/cases/{id}:
    get:
      operationId: getCase
      tags:
        - cases
      summary: Своё обращение и состояние AI
      description: >-
        Контракт будущей реализации. Владелец/назначение и переход проверяются сервером; чужой объект — 404.
        Состояние, роль, оплата и владелец не принимаются из запроса.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
              example:
                id: 00000000-0000-4000-8000-000000000001
                state: work_submitted
                path: specialist
                ai_state: idle
                version: 10
                created_at: "2026-11-15T10:00:00Z"
                updated_at: "2026-11-15T10:00:00Z"
                available_actions:
                  - accept_work
                card_confirmed_at: "2026-11-15T09:00:00Z"
                pool: null
                work:
                  version: 1
                  text: Подготовлен демонстрационный пакет документов.
                  submitted_at: "2026-11-15T10:00:00Z"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /api/cases/{id}/messages:
    get:
      operationId: listMessages
      tags:
        - cases
      summary: Диалог своего обращения
      description: >-
        Контракт будущей реализации. Владелец/назначение и переход проверяются сервером; чужой объект — 404.
        Состояние, роль, оплата и владелец не принимаются из запроса.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Messages"
              example:
                items:
                  - id: 00000000-0000-4000-8000-000000000002
                    author: user
                    text: Оплатила вымышленный курс 1 октября. Учебный проект Демо. Стоимость 68000 рублей.
                    created_at: "2026-11-15T10:00:00Z"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
    post:
      operationId: sendMessage
      tags:
        - cases
      summary: Отправить сообщение
      description: >-
        Только владелец в draft/clarifying, ai_state не thinking. Сохраняет сообщение, ставит Celery-задачу по
        версии, возвращает thinking; опрос GET обращения/сообщений. После failed разрешена повторная отправка
        текста как нового сообщения, старый источник не переписывается.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
        - name: X-CSRFToken
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            example: demo-csrf-token
          description: Значение cookie csrftoken текущей сессии (K2). Не секретный пример.
      responses:
        "202":
          description: Принято для асинхронной обработки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAccepted"
              example:
                message:
                  id: 00000000-0000-4000-8000-000000000002
                  author: user
                  text: Оплатила вымышленный курс 1 октября. Учебный проект Демо. Стоимость 68000 рублей.
                  created_at: "2026-11-15T10:00:00Z"
                case:
                  id: 00000000-0000-4000-8000-000000000001
                  state: draft
                  path: null
                  ai_state: thinking
                  version: 2
                  created_at: "2026-11-15T10:00:00Z"
                  updated_at: "2026-11-15T10:00:00Z"
                  available_actions:
                    - close_case
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
            example:
              text: Оплатила вымышленный курс 1 октября. Учебный проект Демо. Стоимость 68000 рублей.
              expected_version: 1
  /api/cases/{id}/documents:
    post:
      operationId: uploadDocument
      tags:
        - documents
      summary: Загрузить документ
      description: >-
        Только владелец до подтверждения карточки. JPEG/PNG/UTF-8 text; содержимое проверяет S4. Ошибки
        типа/размера/числа файлов — 400. После подтверждения —409. Лимиты задаст S4, замена исходников не
        предусмотрена.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
        - name: X-CSRFToken
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            example: demo-csrf-token
          description: Значение cookie csrftoken текущей сессии (K2). Не секретный пример.
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMetadata"
              example:
                id: 00000000-0000-4000-8000-000000000003
                filename: demo-receipt.txt
                content_type: text/plain
                size_bytes: 128
                created_at: "2026-11-15T10:00:00Z"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
                - expected_version
              properties:
                file:
                  type: string
                  format: binary
                expected_version:
                  $ref: "#/components/schemas/Version"
            encoding:
              file:
                contentType: image/jpeg, image/png, text/plain
            example:
              file: Синтетический чек, только демонстрация.
              expected_version: 1
  /api/cases/{id}/documents/{docId}/content:
    get:
      operationId: downloadDocument
      tags:
        - documents
      summary: Получить разрешённое содержимое документа
      description: >-
        Владелец либо текущий ведущий юрист. Проверяющий получает только подготовленную безопасную редакцию,
        иначе404; подмена docId/родителя или истёкшее назначение —404. Никакого публичного storage URL. Пример
        text/plain — синтетика.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
        - name: docId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000003
            format: uuid
      responses:
        "200":
          description: Разрешённое содержимое; MIME определяется проверенным файлом.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="demo.txt"
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
                example: nosniff
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            text/plain:
              schema:
                type: string
              example: Демонстрационный чек без персональных данных.
            image/png:
              schema:
                type: string
                format: binary
                description: "Байты проверенного PNG; синтетический текстовый mock используйте через Accept: text/plain."
            image/jpeg:
              schema:
                type: string
                format: binary
                description: "Байты проверенного JPEG; синтетический текстовый mock используйте через Accept: text/plain."
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /api/cases/{id}/card:
    get:
      operationId: getCard
      tags:
        - card
      summary: Карточка с цитатами
      description: >-
        Контракт будущей реализации. Владелец/назначение и переход проверяются сервером; чужой объект — 404.
        Состояние, роль, оплата и владелец не принимаются из запроса.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
              example:
                version: 1
                confirmed_at: null
                facts:
                  - key: company_name
                    value: Учебный проект Демо
                    status: found
                    source:
                      kind: message
                      id: 00000000-0000-4000-8000-000000000002
                      source_version: 1
                    source_quote: Учебный проект Демо
                    required: true
                  - key: payment_date
                    value: null
                    status: not_found
                    source: null
                    source_quote: null
                    required: true
                missing_required_fields:
                  - payment_date
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /api/cases/{id}/card/facts/{key}:
    patch:
      operationId: editFact
      tags:
        - card
      summary: Исправить факт
      description: >-
        Только владелец в card_ready; статус факта user_edited. После card_confirmed —409. Нельзя подменять
        исходную цитату или источник через запрос.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
        - name: key
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: company_name
        - name: X-CSRFToken
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            example: demo-csrf-token
          description: Значение cookie csrftoken текущей сессии (K2). Не секретный пример.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
              example:
                version: 2
                confirmed_at: null
                facts:
                  - key: company_name
                    value: Учебный проект Демо
                    status: user_edited
                    source: null
                    source_quote: null
                    required: true
                  - key: payment_date
                    value: null
                    status: not_found
                    source: null
                    source_quote: null
                    required: true
                missing_required_fields:
                  - payment_date
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditFactInput"
            example:
              value: Учебный проект Демо
              expected_version: 1
  /api/cases/{id}/card/confirm:
    post:
      operationId: confirmCard
      tags:
        - card
      summary: Подтвердить версию карточки
      description: >-
        card_ready → card_confirmed, только при заполненных обязательных фактах. Неполнота/устаревшая версия
        —409 с details.fields. Факты и ссылки на исходники замораживаются.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
        - name: X-CSRFToken
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            example: demo-csrf-token
          description: Значение cookie csrftoken текущей сессии (K2). Не секретный пример.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
              example:
                id: 00000000-0000-4000-8000-000000000001
                state: card_confirmed
                path: null
                ai_state: idle
                version: 3
                created_at: "2026-11-15T10:00:00Z"
                updated_at: "2026-11-15T10:00:00Z"
                available_actions:
                  - choose_path
                  - close_case
                card_confirmed_at: "2026-11-15T09:00:00Z"
                pool: null
                work: null
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmCardInput"
            example:
              expected_version: 2
              card_version: 2
  /api/cases/{id}/company:
    get:
      operationId: getCompany
      tags:
        - guidance
      summary: Проверка компании
      description: >-
        Контракт будущей реализации. Владелец/назначение и переход проверяются сервером; чужой объект — 404.
        Состояние, роль, оплата и владелец не принимаются из запроса.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyCheck"
              example:
                status: active
                name: null
                inn: null
                registered_on: null
                source: demo-fixture
                checked_at: "2026-11-15T10:00:00Z"
                is_demo: true
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /api/cases/{id}/paths:
    get:
      operationId: getPaths
      tags:
        - guidance
      summary: Три доступных пути
      description: >-
        До подтверждения карточки409; claim доступен только active. При unavailable проверки компании путь не
        блокирует self_guided; соответствующее объяснение обязательно.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paths"
              example:
                items:
                  - path: self_guided
                    title: Реши сам
                    available: true
                    reason: null
                    estimated_days: 1
                    price_kopecks: 0
                  - path: claim
                    title: Официальный запрос
                    available: true
                    reason: null
                    estimated_days: 1
                    price_kopecks: 149000
                  - path: specialist
                    title: Обращение к специалисту
                    available: true
                    reason: null
                    estimated_days: 2
                    price_kopecks: null
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /api/cases/{id}/path:
    post:
      operationId: choosePath
      tags:
        - guidance
      summary: Выбрать путь
      description: >-
        Владелец после подтверждения и по разрешённым переходам. specialist переводит в in_pool, но НЕ создаёт
        и не публикует PoolCard. Для неё нужен отдельный POST /pool; повторный выбор не создаёт дубликатов.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: 00000000-0000-4000-8000-000000000001
            format: uuid
        - name: X-CSRFToken
          in: header
