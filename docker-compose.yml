name: newsmediaholding

x-backend-env: &backend-env
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-placeholder-change-me}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web,backend}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  POSTGRES_DB: ${POSTGRES_DB:-app}
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-local-placeholder}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  AUTH_LOGIN_ATTEMPTS: ${AUTH_LOGIN_ATTEMPTS:-10}
  AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-60}
  AUTH_TRUST_PROXY_HEADER: ${AUTH_TRUST_PROXY_HEADER:-true}
  DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo-user-placeholder}
  DEMO_LAWYER_PASSWORD: ${DEMO_LAWYER_PASSWORD:-demo-lawyer-placeholder}
  DEMO_MODERATOR_PASSWORD: ${DEMO_MODERATOR_PASSWORD:-demo-moderator-placeholder}
  DEMO_EDITOR_PASSWORD: ${DEMO_EDITOR_PASSWORD:-demo-editor-placeholder}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-local-placeholder}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    volumes:
      - admin-static:/app/staticfiles
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    build: ./backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 15s

  web:
    build: ./frontend
    volumes:
      - admin-static:/srv/admin-static:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Contract mock: `docker compose --profile mock up -d mock`, then http://localhost:4010
  mock:
    image: stoplight/prism:5
    profiles: ["mock"]
    # Prism 5.15.10: avoid cluster.default.isPrimary failure in multiprocess mode.
    command: ["mock", "-h", "0.0.0.0", "--multiprocess", "false", "/docs/openapi.yaml"]
    volumes:
      - ./docs:/docs:ro
    ports:
      - "${MOCK_PORT:-4010}:4010"

volumes:
  db-data:
  admin-static:
